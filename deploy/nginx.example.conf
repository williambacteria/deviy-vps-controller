map $http_upgrade $deviy_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name controller.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name controller.example.com;
    ssl_certificate /etc/ssl/controller/fullchain.pem;
    ssl_certificate_key /etc/ssl/controller/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /__azure/ {
        alias /www/wwwroot/demovps.deviy.cn/ui-azure/;
        autoindex off;
        expires 1h;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/__azure/theme-init.js?v=20261123"></script><link rel="stylesheet" href="/__azure/fonts/noto-sc/noto-sc.css?v=20261123"></head>';
        sub_filter '</body>' '<link rel="stylesheet" href="/__azure/azure.css?v=20261123"><link rel="stylesheet" href="/__azure/theme.css?v=20261123"><script src="/__azure/azure.js?v=20261123" defer></script><script src="/__azure/theme.js?v=20261123" defer></script></body>';
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $deviy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
