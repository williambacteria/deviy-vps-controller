<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
登录 · Deviy Controller</title>
<style>
.brand-logo{height:38px;width:auto;display:block}
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand2:#38bdf8;--danger:#dc2626}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#070d1a;color:var(--ink);overflow-x:hidden}
.page{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(420px,.95fr);position:relative}
.page:before{content:"";position:absolute;inset:0;background:
 radial-gradient(900px 520px at 18% 12%,rgba(37,99,235,.35),transparent 62%),
 radial-gradient(760px 520px at 82% 88%,rgba(56,189,248,.18),transparent 60%),
 linear-gradient(135deg,#07101f 0%,#0b1220 48%,#07101f 100%);z-index:-2}
.page:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 30% 30%,#000 0%,transparent 72%);z-index:-1}
.hero{padding:56px 7vw;display:flex;flex-direction:column;justify-content:space-between;color:#e2e8f0;min-height:100vh}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:850;font-size:19px;color:#fff;background:linear-gradient(135deg,#38bdf8,#2563eb);box-shadow:0 12px 34px rgba(37,99,235,.35)}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:#7dd3fc;font-size:10px;letter-spacing:.24em;margin-top:2px}
.hero-copy{max-width:560px;padding:8vh 0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#93c5fd;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(147,197,253,.25);background:rgba(37,99,235,.12);padding:7px 11px;border-radius:999px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.12)}
h1{font-size:clamp(34px,4vw,58px);line-height:1.08;letter-spacing:-.035em;color:#fff;margin:23px 0 18px;font-weight:800}
h1 span{background:linear-gradient(90deg,#7dd3fc,#60a5fa 55%,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{color:#94a3b8;font-size:15px;line-height:1.85;margin:0;max-width:470px}
.facts{display:flex;gap:26px;flex-wrap:wrap;color:#94a3b8;font-size:12px}
.facts b{display:block;color:#e2e8f0;font-size:15px;margin-bottom:2px}
.panel-wrap{display:flex;align-items:center;justify-content:center;padding:48px 5vw;min-height:100vh}
.panel{width:min(420px,100%);background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:34px 34px 28px;box-shadow:0 34px 100px rgba(2,6,23,.5);backdrop-filter:blur(18px)}
.panel h2{margin:0;font-size:25px;letter-spacing:-.02em;color:var(--ink)}
.panel .sub{margin:7px 0 25px;color:var(--muted);font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:650;color:#334155;margin-bottom:7px}
.control{position:relative}
.control svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#94a3b8;pointer-events:none}
.control input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;padding:0 44px 0 40px;font-size:14px;color:var(--ink);outline:none;transition:.16s}
.control input:focus{border-color:#93c5fd;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.control input::placeholder{color:#94a3b8}
.reveal{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#64748b;font-size:11px;font-weight:700;padding:8px;cursor:pointer;border-radius:7px}
.reveal:hover{background:#eef2f7;color:#0f172a}
.error{display:none;margin:0 0 14px;padding:10px 12px;border-radius:9px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;line-height:1.5}
.error.show{display:block}
.submit{width:100%;height:47px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:14px;font-weight:750;letter-spacing:.02em;cursor:pointer;box-shadow:0 12px 26px rgba(37,99,235,.28);transition:.16s}
.submit:hover{filter:brightness(1.06);transform:translateY(-1px)}
.submit:disabled{opacity:.7;cursor:wait;transform:none}
.meta{display:flex;justify-content:space-between;align-items:center;margin:13px 0 0;color:#94a3b8;font-size:11px}
.secure{display:inline-flex;align-items:center;gap:5px}
.secure i{width:6px;height:6px;border-radius:50%;background:#22c55e}
.divider{height:1px;background:var(--line);margin:24px 0 17px}
.foot{text-align:center;color:#94a3b8;font-size:11px;line-height:1.6}
.foot b{color:#475569}
@media(max-width:900px){.page{grid-template-columns:1fr}.hero{min-height:auto;padding:30px 22px 6px}.hero-copy{padding:28px 0 0}.hero-copy p{max-width:none}.facts{display:none}.panel-wrap{min-height:auto;padding:20px 18px 40px}.panel{padding:28px 24px}.hero h1{font-size:35px}}
@media(max-width:420px){.panel{padding:24px 20px;border-radius:17px}.brand b{font-size:15px}.hero h1{font-size:31px}}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="brand"><img class="brand-logo" src="/devicloud-logo-light.png" alt="Devicloud 德威云计算"></div>
    <div class="hero-copy">
      <span class="eyebrow"><i></i>云资源控制面</span>
      <h1>宿主机、IP 与<br><span>虚拟机编排</span><br>收进一个面板</h1>
      <p>集中管理 KVM、PVE 与 Hyper-V 节点，统一 IP 池、镜像、NAT 端口和虚拟机生命周期。请登录后继续。</p>
    </div>
    <div class="facts">
      <div><b>多节点</b>统一 Agent 接入</div>
      <div><b>IPAM</b>独立 IP / 内网 NAT</div>
      <div><b>编排</b>资源与网络闭环</div>
    </div>
  </section>

  <main class="panel-wrap">
    <form class="panel" id="login-form" method="post" autocomplete="on">
      <h2>登录控制台</h2>
      <p class="sub">使用管理员账号访问 Deviy Controller</p>
      <div class="error" id="login-error" role="alert"></div>

      <div class="field">
        <label for="username">用户名</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required>
          <button class="reveal" type="button" id="reveal" aria-label="显示密码">显示</button>
        </div>
      </div>

      <button class="submit" type="submit" id="submit">登录</button>
      <div class="meta"><span class="secure"><i></i>加密会话</span><span>Deviy Cloud</span></div>
      <div class="divider"></div>
      <div class="foot"><b>Deviy Controller</b> · 云资源控制面<br>仅限授权管理员访问</div>
    </form>
  </main>
</div>
<script>
(function(){
  const form=document.getElementById('login-form');
  const error=document.getElementById('login-error');
  const submit=document.getElementById('submit');
  const password=document.getElementById('password');
  const reveal=document.getElementById('reveal');
  const next=new URLSearchParams(location.search).get('next')||'/';
  reveal.addEventListener('click',()=>{
    const showing=password.type==='text';
    password.type=showing?'password':'text';
    reveal.textContent=showing?'显示':'隐藏';
    password.focus();
  });
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    error.classList.remove('show');
    submit.disabled=true; submit.textContent='正在登录…';
    try{
      const response=await fetch('/api/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:form.username.value,password:form.password.value})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok){throw new Error(data.error||'登录失败');}
      location.href=next.startsWith('/')&&!next.startsWith('//')?next:'/';
    }catch(err){
      error.textContent=err.message||'登录失败，请稍后重试';
      error.classList.add('show');
      submit.disabled=false; submit.textContent='登录';
      password.select();
    }
  });
})();
</script>
</body>
</html>
